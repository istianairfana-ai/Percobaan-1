<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Siklus Air - Tito si Tetes Air</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'Fredoka', sans-serif; }
        #gameCanvas { cursor: pointer; image-rendering: auto; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
        .float-anim { animation: float 2s ease-in-out infinite; }
    </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full overflow-auto bg-gradient-to-b from-sky-200 to-blue-400 m-0">
  <div class="h-full w-full flex flex-col items-center p-4">
   <h1 id="gameTitle" class="text-2xl md:text-3xl font-bold text-blue-900 mb-2 float-anim">🌊 Petualangan Tito si Tetes Air 💧</h1>
   <div class="flex gap-4 mb-2 text-sm md:text-base">
    <div class="bg-white/80 rounded-lg px-3 py-1 font-semibold text-blue-800">
     Tahap: <span id="stageLabel">Evaporasi</span>
    </div>
    <div class="bg-white/80 rounded-lg px-3 py-1 font-semibold text-amber-700">
     Skor: <span id="score">0</span>
    </div>
   </div>
   <div class="bg-white/60 rounded-lg px-3 py-1 mb-2 text-sm text-blue-900" id="instruction">
    ☀️ Klik &amp; tahan Matahari untuk membantu Tito menguap!
   </div>
   <canvas id="gameCanvas" class="rounded-xl border-4 border-white/50 shadow-xl max-w-full"></canvas>
   <div id="factBox" class="mt-2 bg-white/80 rounded-lg px-4 py-2 max-w-md text-sm text-blue-900 hidden"><span id="factText"></span>
   </div>
  </div>
  <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const stageLabel = document.getElementById('stageLabel');
        const instruction = document.getElementById('instruction');
        const factBox = document.getElementById('factBox');
        const factText = document.getElementById('factText');

        // Responsive canvas
        function resizeCanvas() {
            const maxW = Math.min(700, window.innerWidth - 40);
            const maxH = Math.min(420, window.innerHeight - 220);
            canvas.width = maxW;
            canvas.height = maxH;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stages = ['evaporasi', 'kondensasi', 'presipitasi', 'selesai'];
        const facts = [
            "Evaporasi: Air laut menguap karena panas matahari! ☀️",
            "Kondensasi: Uap air naik dan menjadi awan! ☁️",
            "Presipitasi: Awan menjadi hujan dan turun ke bumi! 🌧️",
            "Siklus air terus berulang tanpa henti! 🔄"
        ];

        let state = {
            stage: 0,
            score: 0,
            titoX: 0.5,
            titoY: 0.85,
            isHolding: false,
            particles: [],
            clouds: [],
            raindrops: [],
            stageProgress: 0,
            showFact: false,
            transitioning: false
        };

        function resetForStage() {
            state.stageProgress = 0;
            state.isHolding = false;
            state.particles = [];
            state.transitioning = false;
            
            if (state.stage === 0) {
                state.titoY = 0.85;
                instruction.textContent = "☀️ Klik & tahan Matahari untuk membantu Tito menguap!";
            } else if (state.stage === 1) {
                state.titoY = 0.3;
                state.clouds = [];
                instruction.textContent = "☁️ Klik awan untuk mengumpulkan uap air!";
            } else if (state.stage === 2) {
                state.titoY = 0.15;
                state.raindrops = [];
                instruction.textContent = "🌧️ Klik awan agar Tito turun sebagai hujan!";
            } else {
                instruction.textContent = "🎉 Siklus air selesai! Klik untuk bermain lagi!";
            }
            stageLabel.textContent = state.stage < 3 ? ['Evaporasi', 'Kondensasi', 'Presipitasi'][state.stage] : 'Selesai!';
            showFact(state.stage);
        }

        function showFact(idx) {
            factBox.classList.remove('hidden');
            factText.textContent = facts[idx];
        }

        // Drawing helpers
        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (state.stage === 2) {
                grad.addColorStop(0, '#546e7a');
                grad.addColorStop(1, '#1565c0');
            } else {
                grad.addColorStop(0, '#87CEEB');
                grad.addColorStop(1, '#1e88e5');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawWater() {
            const waterY = canvas.height * 0.75;
            const grad = ctx.createLinearGradient(0, waterY, 0, canvas.height);
            grad.addColorStop(0, '#0288d1');
            grad.addColorStop(1, '#01579b');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, waterY);
            for (let x = 0; x <= canvas.width; x += 20) {
                ctx.lineTo(x, waterY + Math.sin(x * 0.03 + Date.now() * 0.002) * 5);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }

        function drawSun() {
            const sx = canvas.width * 0.85, sy = canvas.height * 0.12, r = canvas.width * 0.06;
            // Rays
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(Date.now() * 0.001);
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(0, r + 5);
                ctx.lineTo(0, r + 18);
                ctx.strokeStyle = '#FFA000';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.rotate(Math.PI / 4);
            }
            ctx.restore();
            // Body
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            const sunGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
            sunGrad.addColorStop(0, '#FFEE58');
            sunGrad.addColorStop(1, '#FF8F00');
            ctx.fillStyle = sunGrad;
            ctx.fill();
            // Face
            ctx.fillStyle = '#5D4037';
            ctx.beginPath();
            ctx.arc(sx - r * 0.25, sy - r * 0.1, 3, 0, Math.PI * 2);
            ctx.arc(sx + r * 0.25, sy - r * 0.1, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sx, sy + r * 0.2, r * 0.3, 0, Math.PI);
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawTito() {
            const x = canvas.width * state.titoX;
            const y = canvas.height * state.titoY;
            const size = 20;

            ctx.save();
            ctx.translate(x, y);
            
            // Drop shape
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.bezierCurveTo(-size * 0.8, size * 0.3, -size * 0.6, size, 0, size);
            ctx.bezierCurveTo(size * 0.6, size, size * 0.8, size * 0.3, 0, -size);
            
            let color = '#00BCD4';
            if (state.stage === 0 && state.isHolding) color = 'rgba(255,255,255,0.7)';
            if (state.stage === 1) color = 'rgba(200,230,255,0.8)';
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-5, 2, 4, 0, Math.PI * 2);
            ctx.arc(5, 2, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a237e';
            ctx.beginPath();
            ctx.arc(-5, 2, 2, 0, Math.PI * 2);
            ctx.arc(5, 2, 2, 0, Math.PI * 2);
            ctx.fill();
            // Smile
            ctx.beginPath();
            ctx.arc(0, 8, 5, 0, Math.PI);
            ctx.strokeStyle = '#1a237e';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        function drawCloud(cx, cy, scale) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.fillStyle = state.stage === 2 ? '#78909c' : '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.arc(25, -5, 20, 0, Math.PI * 2);
            ctx.arc(-25, -3, 18, 0, Math.PI * 2);
            ctx.arc(12, -15, 18, 0, Math.PI * 2);
            ctx.arc(-10, -12, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawParticles() {
            state.particles.forEach((p, i) => {
                p.y -= p.speed;
                p.x += Math.sin(p.y * 0.05) * 0.5;
                p.life -= 0.01;
                if (p.life <= 0) { state.particles.splice(i, 1); return; }
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${p.life})`;
                ctx.fill();
            });
        }

        function drawRain() {
            state.raindrops.forEach((r, i) => {
                r.y += r.speed;
                if (r.y > canvas.height * 0.75) { state.raindrops.splice(i, 1); return; }
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x, r.y + 10);
                ctx.strokeStyle = 'rgba(100,180,255,0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // Interaction
        let mouseDown = false;
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        function isOnSun(pos) {
            const sx = canvas.width * 0.85, sy = canvas.height * 0.12, r = canvas.width * 0.08;
            return Math.hypot(pos.x - sx, pos.y - sy) < r;
        }

        function isOnCloud(pos) {
            return pos.y < canvas.height * 0.4 && pos.y > canvas.height * 0.1;
        }

        canvas.addEventListener('mousedown', (e) => { mouseDown = true; handleInteraction(getPos(e)); });
        canvas.addEventListener('mouseup', () => { mouseDown = false; state.isHolding = false; });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); mouseDown = true; handleInteraction(getPos(e)); });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); mouseDown = false; state.isHolding = false; });

        function handleInteraction(pos) {
            if (state.stage === 0 && isOnSun(pos)) {
                state.isHolding = true;
            } else if (state.stage === 1 && isOnCloud(pos)) {
                state.stageProgress += 10;
                state.score += 5;
            } else if (state.stage === 2 && isOnCloud(pos)) {
                state.isHolding = true;
                for (let i = 0; i < 3; i++) {
                    state.raindrops.push({ x: pos.x + (Math.random() - 0.5) * 60, y: canvas.height * 0.25, speed: 3 + Math.random() * 3 });
                }
            } else if (state.stage === 3) {
                state.stage = 0;
                state.score = 0;
                resetForStage();
            }
        }

        // Game loop
        function update() {
            drawSky();
            drawWater();
            drawSun();

            // Stage-specific logic
            if (state.stage === 0) {
                if (state.isHolding && mouseDown) {
                    state.titoY -= 0.003;
                    state.score += 1;
                    state.particles.push({ x: canvas.width * state.titoX + (Math.random() - 0.5) * 10, y: canvas.height * state.titoY, speed: 1 + Math.random(), life: 1 });
                }
                if (state.titoY <= 0.3) {
                    state.stage = 1;
                    resetForStage();
                }
            } else if (state.stage === 1) {
                drawCloud(canvas.width * 0.3, canvas.height * 0.2, 1.2);
                drawCloud(canvas.width * 0.6, canvas.height * 0.25, 1);
                if (state.stageProgress >= 100) {
                    state.stage = 2;
                    resetForStage();
                }
            } else if (state.stage === 2) {
                drawCloud(canvas.width * 0.4, canvas.height * 0.2, 1.5);
                drawRain();
                if (state.isHolding && mouseDown) {
                    state.titoY += 0.004;
                    state.score += 1;
                }
                if (state.titoY >= 0.75) {
                    state.stage = 3;
                    resetForStage();
                }
            }

            drawParticles();
            drawTito();

            if (state.stage === 3) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${canvas.width * 0.04}px Fredoka`;
                ctx.textAlign = 'center';
                ctx.fillText('🎉 Siklus Air Selesai! 🎉', canvas.width / 2, canvas.height * 0.4);
                ctx.font = `${canvas.width * 0.03}px Fredoka`;
                ctx.fillText(`Skor: ${state.score}`, canvas.width / 2, canvas.height * 0.5);
                ctx.fillText('Klik untuk bermain lagi!', canvas.width / 2, canvas.height * 0.6);
                ctx.textAlign = 'left';
            }

            scoreEl.textContent = state.score;
            requestAnimationFrame(update);
        }

        resetForStage();
        update();

        // Element SDK
        const defaultConfig = {
            game_title: "🌊 Petualangan Tito si Tetes Air 💧",
            background_color: "#e0f7fa",
            surface_color: "#ffffff",
            text_color: "#01579b",
            primary_action_color: "#0288d1",
            font_family: "Fredoka"
        };

        window.elementSdk.init({
            defaultConfig,
            onConfigChange: async (config) => {
                const title = config.game_title || defaultConfig.game_title;
                const bg = config.background_color || defaultConfig.background_color;
                const surface = config.surface_color || defaultConfig.surface_color;
                const text = config.text_color || defaultConfig.text_color;
                const primary = config.primary_action_color || defaultConfig.primary_action_color;
                const font = config.font_family || defaultConfig.font_family;

                document.getElementById('gameTitle').textContent = title;
                document.body.style.background = `linear-gradient(to bottom, ${bg}, ${primary})`;
                document.querySelectorAll('.bg-white\\/80, .bg-white\\/60').forEach(el => {
                    el.style.backgroundColor = surface + 'cc';
                });
                document.getElementById('gameTitle').style.color = text;
                document.querySelectorAll('[class*="text-blue-900"]').forEach(el => el.style.color = text);
                document.getElementById('gameTitle').style.fontFamily = `${font}, sans-serif`;
            },
            mapToCapabilities: (config) => ({
                recolorables: [
                    { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
                    { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
                    { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
                    { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); } }
                ],
                borderables: [],
                fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
                fontSizeable: undefined
            }),
            mapToEditPanelValues: (config) => new Map([
                ["game_title", config.game_title || defaultConfig.game_title]
            ])
        });
    </script>
